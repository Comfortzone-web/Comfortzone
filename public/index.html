<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HVAC Workflow App</title>
  <link rel="stylesheet" href="/styles.css?v=20260727-area-ypiece-fix">
  <link rel="stylesheet" href="/projects.css?v=20261006-projects-style-2">
  <link rel="stylesheet" href="/maintenance.css?v=20261026-billing">
</head>
<body class="auth-pending">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CZ</div>
      <div>
        <strong>Comfort Zone</strong>
        <span>Daikin Authorized Dealer</span>
      </div>
    </div>
    <button id="salesDeskBtn" class="nav-button">Sales Desk</button>
    <div id="salesDeskSubnav" class="subnav hidden">
      <button data-sales-view="dashboard">Dashboard</button>
      <button data-sales-view="leads">Leads</button>
      <button data-sales-view="customers">Customers</button>
      <button data-sales-view="costing">Costing Sheet</button>
      <button data-sales-view="quotation">Quotation</button>
      <button data-sales-view="projects">Projects</button>
      <button data-sales-view="orderBook">Order Book</button>
    </div>
    <button id="newProjectBtn" class="nav-button active">Workflow</button>
    <div id="projectSubnav" class="subnav">
      <button id="workflowCanvasBtn">VRV Workflow</button>
      <button id="dxWorkflowBtn">DX Workflow</button>
      <button id="documentsBtn">My WorkFlows</button>
    </div>
    <button id="inventoryBtn" class="nav-button">Inventory</button>
    <div id="inventorySubnav" class="subnav hidden">
      <button data-inventory-view="dashboard">Dashboard</button>
      <button data-inventory-view="supplier">Supplier DN</button>
      <button data-inventory-view="delivery">Delivery Note</button>
      <button data-inventory-view="stock">Stock</button>
    </div>
    <button id="purchaseOrdersBtn" class="nav-button">Purchase Orders</button>
    <button id="areaCalculationBtn" class="nav-button">Area Calculation</button>
    <button id="projectsBtn" class="nav-button">Projects</button>
    <button id="maintenanceBtn" class="nav-button maintenance-nav-button" aria-expanded="false">Maintenance <span class="maintenance-chevron" aria-hidden="true"></span></button>
    <div id="maintenanceSubnav" class="subnav maintenance-subnav hidden">
      <button data-maintenance-view="dashboard">Dashboard</button>
      <button data-maintenance-view="amc">AMC Register</button>
      <button data-maintenance-view="billing">Billing &amp; Payments</button>
      <button data-maintenance-view="schedule">PM Schedule</button>
      <button data-maintenance-view="work-orders">Work Orders</button>
      <button data-maintenance-view="technicians">Technicians</button>
      <button data-maintenance-view="reports">Service Reports</button>
    </div>
    <div class="sidebar-footer">
      <button id="settingsBtn" class="nav-button">Settings</button>
      <button id="logoutBtn" class="nav-button">Logout</button>
    </div>
  </aside>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Workflow</h1>
        <p id="projectMeta">Create a workflow canvas, upload files, and generate BOQ/quotation outputs.</p>
      </div>
      <div class="top-actions">
        <button id="saveBtn" class="primary-button save-project-top">New Workflow</button>
        <button id="zoomOutBtn" class="ghost-button">-</button>
        <button id="zoomFitBtn" class="ghost-button">Fit</button>
        <button id="zoomInBtn" class="ghost-button">+</button>
        <button id="addNodeBtn" class="icon-button" title="Add file node">+</button>
      </div>
      <div id="viewActions" class="top-actions hidden"></div>
    </header>

    <section id="documentsView" class="documents-view hidden">
      <div class="documents-header">
        <input id="searchInput" type="search" placeholder="Search by project, customer, quotation no., enquiry no.">
      </div>
      <div id="projectList" class="project-list"></div>
    </section>

    <section id="inventoryView" class="inventory-view hidden">
      <div id="inventoryRoot"></div>
    </section>

    <section id="purchaseOrdersView" class="purchase-orders-view hidden">
      <div id="purchaseOrdersRoot"></div>
    </section>

    <section id="areaCalculationView" class="area-calculation-view hidden">
      <div id="areaCalculationRoot"></div>
      <input id="areaDrawingInput" class="hidden" type="file" accept=".pdf,.png,.jpg,.jpeg" multiple>
    </section>

    <section id="salesDeskView" class="inventory-view hidden">
      <div id="salesDeskRoot"></div>
    </section>

    <section id="projectsView" class="projects-view hidden">
      <div id="projectsRoot"></div>
    </section>

    <section id="maintenanceView" class="maintenance-view hidden">
      <div id="maintenanceRoot"></div>
    </section>

    <section id="settingsView" class="inventory-view hidden">
      <div id="settingsRoot"></div>
    </section>

    <section id="canvasView" class="canvas-wrap">
      <div id="canvas" class="canvas"></div>
    </section>
  </main>

  <section id="loginView" class="login-view hidden">
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="brand login-brand">
        <div class="brand-mark">CZ</div>
        <div>
          <strong>Comfort Zone</strong>
          <span>Daikin Authorized Dealer</span>
        </div>
      </div>
      <h1>Login</h1>
      <p>Use your admin or employee login to continue.</p>
      <label>Email<input id="loginEmail" type="email" autocomplete="off" name="cz-login-email" data-lpignore="true" required></label>
      <label>Password<input id="loginPassword" type="password" autocomplete="off" name="cz-login-passcode" data-lpignore="true" required></label>
      <button class="primary-button" type="submit">Login</button>
      <p id="loginMessage" class="login-message"></p>
    </form>
  </section>

  <section id="chatPanel" class="chat-panel hidden">
    <div class="chat-card">
      <header>
        <strong>Thermal Sheet Assistant</strong>
        <button id="closeChatBtn" class="chat-close-button" aria-label="Close thermal assistant">X</button>
      </header>
      <div id="chatLog" class="chat-log"></div>
      <div class="chat-controls">
        <input id="thermalFileInput" type="file" accept=".pdf,.png,.jpg,.jpeg" multiple>
        <div class="chat-reply-row">
          <input id="thermalChatReplyInput" type="text">
          <button id="thermalChatSendBtn" class="ghost-button">Send</button>
        </div>
        <button id="confirmThermalBtn" class="primary-button">Extract Table</button>
      </div>
    </div>
  </section>

  <template id="nodeTemplate">
    <article class="node">
      <header class="node-header">
        <h2></h2>
        <button class="menu-button" title="Options">...</button>
      </header>
      <div class="node-menu hidden"></div>
      <div class="node-body"></div>
    </article>
  </template>

  <script src="/projects-module.js?v=20261024-stale-refresh"></script>
  <script src="/maintenance-billing.js?v=20261026-billing"></script>
  <script src="/maintenance.js?v=20261026-billing"></script>
  <script src="/app.js?v=20261026-billing"></script>
</body>
</html>
